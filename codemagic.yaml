workflows:
  testflight:
    name: Publishing to TestFlight workflow
    environment:
      ios_signing:
        distribution_type: app_store  # Add this line
    scripts:
      - script: flutter packages pub get
      - name: Build iOS
        script: |
          flutter build ipa --release --no-codesign
      - name: Code sign with automatic profiles
        script: |
          xcode-project use-profiles
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - fko.cleanswitch@gmail.com
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - QA
          - team

  app-store:
    name: Publishing to App Store workflow
    environment:
      ios_signing:
        distribution_type: app_store  # Add this line
    scripts:
      - script: flutter packages pub get
      - name: Build iOS
        script: |
          flutter build ipa --release --no-codesign
      - name: Code sign with automatic profiles
        script: |
          xcode-project use-profiles
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - fko.cleanswitch@gmail.com
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: true